<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotus CRM - v6.1 Stable</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div style="position:fixed; top:0; left:0; background:#10B981; color:white; font-size:10px; padding:2px 8px; z-index:9999; border-radius: 0 0 4px 0;">v6.1 Stable</div>

    <div class="app-container">
        <header class="app-header">
            <div class="logo"><i class="fa-solid fa-leaf"></i> <span>Lotus CRM</span></div>
            <div class="header-filters">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Tìm tên khách, sđt...">
                </div>
                <select id="month-filter" class="filter-select">
                    <option value="all">Tất cả các tháng</option>
                    <option value="current">Tháng này</option>
                    <option value="last">Tháng trước</option>
                </select>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline" id="btn-settings"><i class="fa-solid fa-gear"></i></button>
                <button class="btn btn-outline" id="btn-dashboard"><i class="fa-solid fa-chart-pie"></i> Tổng hợp</button>
                <button class="btn btn-primary" id="btn-upload"><i class="fa-solid fa-cloud-arrow-up"></i> Tải Báo Giá (AI)</button>
            </div>
        </header>

        <main class="board" id="board">
            <div class="column" data-status="quote">
                <div class="column-header" style="border-top-color: var(--tag-quote)"><div class="column-header-top"><span>Báo Giá</span><span class="col-count">0</span></div><div class="col-total">0 đ</div></div>
                <div class="column-body" id="col-quote"></div>
            </div>
            <div class="column" data-status="confirm">
                <div class="column-header" style="border-top-color: var(--tag-confirm)"><div class="column-header-top"><span>Chốt Đơn</span><span class="col-count">0</span></div><div class="col-total">0 đ</div></div>
                <div class="column-body" id="col-confirm"></div>
            </div>
            <div class="column" data-status="deliver">
                <div class="column-header" style="border-top-color: var(--tag-deliver)"><div class="column-header-top"><span>Đã Giao Hàng</span><span class="col-count">0</span></div><div class="col-total">0 đ</div></div>
                <div class="column-body" id="col-deliver"></div>
            </div>
            <div class="column" data-status="paid">
                <div class="column-header" style="border-top-color: var(--tag-paid)"><div class="column-header-top"><span>Thu Tiền Hoàn Tất</span><span class="col-count">0</span></div><div class="col-total">0 đ</div></div>
                <div class="column-body" id="col-paid"></div>
            </div>
            <div class="column" data-status="debt">
                <div class="column-header" style="border-top-color: var(--tag-debt)"><div class="column-header-top"><span>Công Nợ Chưa Thu</span><span class="col-count">0</span></div><div class="col-total">0 đ</div></div>
                <div class="column-body" id="col-debt"></div>
            </div>
            <div class="column" data-status="completed">
                <div class="column-header" style="border-top-color: #0F766E"><div class="column-header-top"><span>Hoàn Tất</span><span class="col-count">0</span></div><div class="col-total">0 đ</div></div>
                <div class="column-body" id="col-completed"></div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-header"><h3>Cấu hình AI</h3><button class="close-btn"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body">
                <div class="form-group"><label>Google Gemini API Key</label><input type="password" id="apiKeyInput"></div>
                <div class="form-actions"><button class="btn btn-outline close-modal">Đóng</button><button class="btn btn-primary" id="btn-save-key">Lưu</button></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="upload-modal">
        <div class="modal">
            <div class="modal-header"><h3>Tải Báo Giá (AI)</h3><button class="close-btn"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body">
                <div class="upload-area" id="upload-area">
                    <input type="file" id="file-input" accept="image/*" hidden>
                    <i class="fa-regular fa-image upload-icon"></i>
                    <p>Nhấn để chọn ảnh báo giá</p>
                </div>
                <div id="scan-loader" class="scan-loader hidden"><div class="spinner"></div><p>AI đang phân tích...</p></div>
                <form id="order-form" class="hidden">
                    <div class="form-grid">
                        <div class="form-group"><label>Tên Khách Hàng</label><input type="text" id="customerName" required></div>
                        <div class="form-group"><label>SĐT</label><input type="text" id="phone"></div>
                        <div class="form-group full-width"><label>Địa Chỉ</label><input type="text" id="address"></div>
                        <div class="form-group"><label>Số Báo Giá</label><input type="text" id="quoteNumber"></div>
                        <div class="form-group"><label>Tổng Tiền (VNĐ)</label><input type="text" id="amount" required></div>
                    </div>
                    <div class="form-actions"><button type="button" class="btn btn-outline close-modal">Hủy</button><button type="submit" class="btn btn-primary">Lưu Đơn Hàng</button></div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="dashboard-modal">
        <div class="modal modal-lg">
            <div class="modal-header"><h3>Thống Kê Doanh Thu</h3><button class="close-btn"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body">
                <div class="dashboard-grid">
                    <div class="stat-card"><div class="stat-icon bg-blue"><i class="fa-solid fa-file-invoice-dollar"></i></div><div class="stat-info"><span class="stat-label">Tổng Báo Giá</span><h4 class="stat-value" id="stat-quote">0 đ</h4></div></div>
                    <div class="stat-card"><div class="stat-icon bg-green"><i class="fa-solid fa-check-double"></i></div><div class="stat-info"><span class="stat-label">Đã Giao/Hoàn Tất</span><h4 class="stat-value" id="stat-completed">0 đ</h4></div></div>
                    <div class="stat-card"><div class="stat-icon bg-red"><i class="fa-solid fa-hand-holding-dollar"></i></div><div class="stat-info"><span class="stat-label">Công Nợ</span><h4 class="stat-value" id="stat-debt">0 đ</h4></div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zbnnctvggpupdnjmydcu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__Uc7k0lfdHFzBjWT-3o36w_ydCDXOT8';
        let supabase = null;
        let cards = JSON.parse(localStorage.getItem('lotus_crm_cards')) || [];

        function renderBoard() {
            const searchTerm = (document.getElementById('search-input')?.value || '').toLowerCase();
            const filterMonth = document.getElementById('month-filter')?.value || 'all';
            const now = new Date();
            const cols = ['quote', 'confirm', 'deliver', 'paid', 'debt', 'completed'];

            cols.forEach(status => {
                const body = document.getElementById(`col-${status}`);
                if (!body) return;
                body.innerHTML = '';
                let filtered = cards.filter(c => c.status === status);
                if (filterMonth !== 'all') {
                    filtered = filtered.filter(c => {
                        const d = new Date(c.date);
                        if (filterMonth === 'current') return d.getMonth() === now.getMonth();
                        if (filterMonth === 'last') return d.getMonth() === (now.getMonth() === 0 ? 11 : now.getMonth() - 1);
                        return true;
                    });
                }
                if (searchTerm) filtered = filtered.filter(c => (c.customerName || '').toLowerCase().includes(searchTerm) || (c.phone || '').includes(searchTerm));

                const colHeader = body.parentElement;
                const countBadge = colHeader.querySelector('.col-count');
                const totalText = colHeader.querySelector('.col-total');
                const sum = filtered.reduce((acc, curr) => acc + (Number(curr.amount) || 0), 0);
                if (countBadge) countBadge.textContent = filtered.length;
                if (totalText) totalText.textContent = new Intl.NumberFormat('vi-VN').format(sum) + ' đ';

                filtered.forEach(c => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'card';
                    cardEl.draggable = true;
                    cardEl.dataset.id = c.id;
                    cardEl.innerHTML = `
                        <div class="card-header"><span class="card-quote">#${c.quoteNumber || '---'}</span><span class="card-date">${new Date(c.date).toLocaleDateString('vi-VN')}</span></div>
                        <div class="card-customer">${c.customerName || 'Khách hàng'}</div>
                        <div class="card-info"><span><i class="fa-solid fa-phone"></i> ${c.phone || '---'}</span></div>
                        <div class="card-footer">
                            <div class="card-amount">${new Intl.NumberFormat('vi-VN').format(c.amount || 0)} đ</div>
                            <button class="btn-delete" onclick="deleteCard('${c.id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    cardEl.ondragstart = () => cardEl.classList.add('dragging');
                    cardEl.ondragend = () => cardEl.classList.remove('dragging');
                    body.appendChild(cardEl);
                });

                body.ondragover = e => { e.preventDefault(); body.classList.add('drag-over'); };
                body.ondragleave = () => body.classList.remove('drag-over');
                body.ondrop = async e => {
                    e.preventDefault(); body.classList.remove('drag-over');
                    const drag = document.querySelector('.dragging');
                    if (!drag) return;
                    const id = drag.dataset.id;
                    const idx = cards.findIndex(x => x.id === id);
                    if (idx > -1) {
                        cards[idx].status = status;
                        saveLocal(); renderBoard();
                        if (supabase) await supabase.from('orders').update({ status }).eq('id', id);
                    }
                };
            });
            updateStats();
        }

        function saveLocal() { localStorage.setItem('lotus_crm_cards', JSON.stringify(cards)); }
        function updateStats() {
            const sumBy = s => cards.filter(c => c.status === s).reduce((a, b) => a + (Number(b.amount) || 0), 0);
            const fmt = v => new Intl.NumberFormat('vi-VN').format(v) + ' đ';
            if (document.getElementById('stat-quote')) document.getElementById('stat-quote').textContent = fmt(sumBy('quote'));
            if (document.getElementById('stat-completed')) document.getElementById('stat-completed').textContent = fmt(cards.filter(c => ['completed','paid','deliver'].includes(c.status)).reduce((a,b)=>a+(Number(b.amount)||0),0));
            if (document.getElementById('stat-debt')) document.getElementById('stat-debt').textContent = fmt(sumBy('debt'));
        }

        async function deleteCard(id) {
            if (!confirm('Xoá?')) return;
            cards = cards.filter(c => c.id !== id);
            saveLocal(); renderBoard();
            if (supabase) await supabase.from('orders').delete().eq('id', id);
        }

        function init() {
            renderBoard();
            const bind = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
            
            bind('btn-upload', 'click', () => { document.getElementById('upload-modal').classList.add('active'); document.getElementById('order-form').classList.add('hidden'); document.getElementById('upload-area').classList.remove('hidden'); });
            bind('btn-dashboard', 'click', () => { updateStats(); document.getElementById('dashboard-modal').classList.add('active'); });
            bind('btn-settings', 'click', () => { document.getElementById('apiKeyInput').value = localStorage.getItem('lotus_gemini_key') || ''; document.getElementById('settings-modal').classList.add('active'); });
            
            document.querySelectorAll('.close-btn, .close-modal').forEach(b => b.onclick = () => document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')));
            
            bind('btn-save-key', 'click', () => { localStorage.setItem('lotus_gemini_key', document.getElementById('apiKeyInput').value.trim()); alert('Đã lưu!'); document.getElementById('settings-modal').classList.remove('active'); });
            
            const upArea = document.getElementById('upload-area');
            const fIn = document.getElementById('file-input');
            if (upArea) upArea.onclick = () => fIn.click();
            if (fIn) fIn.onchange = async e => {
                const file = e.target.files[0]; if (!file) return;
                upArea.classList.add('hidden'); document.getElementById('scan-loader').classList.remove('hidden');
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = async () => {
                    try {
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${localStorage.getItem('lotus_gemini_key')}`, {
                            method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: "JSON: customerName, phone, address, quoteNumber, amount" }, { inlineData: { mimeType: file.type, data: reader.result.split(',')[1] } }] }] })
                        });
                        const d = await res.json();
                        const json = JSON.parse(d.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim());
                        document.getElementById('scan-loader').classList.add('hidden'); document.getElementById('order-form').classList.remove('hidden');
                        document.getElementById('customerName').value = json.customerName || '';
                        document.getElementById('phone').value = json.phone || '';
                        document.getElementById('address').value = json.address || '';
                        document.getElementById('quoteNumber').value = json.quoteNumber || '';
                        document.getElementById('amount').value = String(json.amount).replace(/[^0-9]/g, '') || '';
                    } catch (err) { alert("Lỗi AI"); document.getElementById('scan-loader').classList.add('hidden'); upArea.classList.remove('hidden'); }
                };
            };

            document.getElementById('order-form').onsubmit = async e => {
                e.preventDefault();
                const c = { id: Date.now().toString(), customerName: document.getElementById('customerName').value, phone: document.getElementById('phone').value, address: document.getElementById('address').value, quoteNumber: document.getElementById('quoteNumber').value, amount: parseInt(document.getElementById('amount').value) || 0, status: 'quote', date: new Date().toISOString() };
                cards.unshift(c); saveLocal(); renderBoard(); document.getElementById('upload-modal').classList.remove('active');
                if (supabase) await supabase.from('orders').upsert({ id: c.id, customerName: c.customerName, phone: c.phone, address: c.address, quoteNumber: c.quoteNumber, amount: String(c.amount), status: c.status });
            };

            bind('search-input', 'input', renderBoard);
            bind('month-filter', 'change', renderBoard);

            setTimeout(async () => {
                try {
                    if (window.supabase) {
                        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                        const { data } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
                        if (data && data.length > 0) {
                            cards = data.map(d => ({ id: d.id, customerName: d.customerName, phone: d.phone, address: d.address, quoteNumber: d.quoteNumber, amount: parseInt(d.amount) || 0, status: d.status, date: d.created_at }));
                            renderBoard(); saveLocal();
                        }
                    }
                } catch (e) {}
            }, 100);
        }

        init();
    </script>
</body>
</html>
