<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotus CRM - v6.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- DEBUG VERSION TAG -->
    <div style="position:fixed; top:0; left:0; background:red; color:white; font-size:10px; padding:2px 5px; z-index:9999;">v6.0 - Master Debug</div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-leaf"></i>
                <span>Lotus CRM</span>
            </div>
            
            <div class="header-filters">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Tìm tên khách, sđt...">
                </div>
                <select id="month-filter" class="filter-select">
                    <option value="all">Tất cả các tháng</option>
                    <option value="current">Tháng này</option>
                    <option value="last">Tháng trước</option>
                </select>
            </div>

            <div class="header-actions">
                <button class="btn btn-outline" id="btn-settings" title="Cài đặt AI">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <button class="btn btn-outline" id="btn-dashboard">
                    <i class="fa-solid fa-chart-pie"></i> Tổng hợp
                </button>
                <button class="btn btn-primary" id="btn-upload">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Tải Báo Giá (AI)
                </button>
            </div>
        </header>

        <!-- Kanban Board -->
        <main class="board" id="board">
            <div class="column" data-status="quote">
                <div class="column-header" style="border-top-color: var(--tag-quote)">
                    <div class="column-header-top"><span>Báo Giá</span><span class="col-count">0</span></div>
                    <div class="col-total">0 đ</div>
                </div>
                <div class="column-body" id="col-quote"></div>
            </div>
            <div class="column" data-status="confirm">
                <div class="column-header" style="border-top-color: var(--tag-confirm)">
                    <div class="column-header-top"><span>Chốt Đơn</span><span class="col-count">0</span></div>
                    <div class="col-total">0 đ</div>
                </div>
                <div class="column-body" id="col-confirm"></div>
            </div>
            <div class="column" data-status="deliver">
                <div class="column-header" style="border-top-color: var(--tag-deliver)">
                    <div class="column-header-top"><span>Đã Giao Hàng</span><span class="col-count">0</span></div>
                    <div class="col-total">0 đ</div>
                </div>
                <div class="column-body" id="col-deliver"></div>
            </div>
            <div class="column" data-status="paid">
                <div class="column-header" style="border-top-color: var(--tag-paid)">
                    <div class="column-header-top"><span>Thu Tiền Hoàn Tất</span><span class="col-count">0</span></div>
                    <div class="col-total">0 đ</div>
                </div>
                <div class="column-body" id="col-paid"></div>
            </div>
            <div class="column" data-status="debt">
                <div class="column-header" style="border-top-color: var(--tag-debt)">
                    <div class="column-header-top"><span>Công Nợ Chưa Thu</span><span class="col-count">0</span></div>
                    <div class="col-total">0 đ</div>
                </div>
                <div class="column-body" id="col-debt"></div>
            </div>
            <div class="column" data-status="completed">
                <div class="column-header" style="border-top-color: #0F766E">
                    <div class="column-header-top"><span>Hoàn Tất</span><span class="col-count">0</span></div>
                    <div class="col-total">0 đ</div>
                </div>
                <div class="column-body" id="col-completed"></div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Cấu hình AI Đọc Ảnh</h3>
                <button class="close-btn" onclick="closeModals()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Google Gemini API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="Dán mã API Key của bạn vào đây...">
                </div>
                <div class="form-actions">
                    <button class="btn btn-outline" onclick="closeModals()">Đóng</button>
                    <button class="btn btn-primary" onclick="saveApiKey()">Lưu Cấu Hình</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="upload-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Tải Báo Giá</h3>
                <button class="close-btn" onclick="closeModals()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
                    <input type="file" id="file-input" accept="image/*" hidden>
                    <i class="fa-regular fa-image upload-icon"></i>
                    <p>Nhấn để chọn ảnh báo giá</p>
                </div>
                <div id="scan-loader" class="scan-loader hidden">Phân tích bằng AI...</div>
                <form id="order-form" class="hidden">
                    <div class="form-group"><label>Khách hàng</label><input type="text" id="customerName"></div>
                    <div class="form-group"><label>SĐT</label><input type="text" id="phone"></div>
                    <div class="form-group"><label>Địa chỉ</label><input type="text" id="address"></div>
                    <div class="form-group"><label>Số tiền</label><input type="text" id="amount"></div>
                    <div class="form-actions"><button type="submit" class="btn btn-primary">Lưu</button></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        console.log("CRITICAL BOOT v6.0");
        
        let cards = JSON.parse(localStorage.getItem('lotus_crm_cards')) || [];
        let supabase = null;

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value;
            localStorage.setItem('lotus_gemini_key', key);
            alert('Đã lưu!');
            closeModals();
        }

        function renderBoard() {
            ['quote', 'confirm', 'deliver', 'paid', 'debt', 'completed'].forEach(st => {
                const b = document.getElementById('col-'+st);
                if (!b) return;
                b.innerHTML = '';
                const filtered = cards.filter(c => c.status === st);
                
                const colHeader = b.parentElement;
                const countBadge = colHeader.querySelector('.col-count');
                const totalText = colHeader.querySelector('.col-total');
                const sum = filtered.reduce((a, c) => a + (Number(c.amount) || 0), 0);
                if (countBadge) countBadge.textContent = filtered.length;
                if (totalText) totalText.textContent = sum.toLocaleString() + ' đ';

                filtered.forEach(c => {
                    const d = document.createElement('div');
                    d.className = 'card';
                    d.draggable = true;
                    d.dataset.id = c.id;
                    d.innerHTML = `<div>${c.customerName}</div><div style="font-weight:bold">${Number(c.amount).toLocaleString()} đ</div>`;
                    d.ondragstart = () => d.classList.add('dragging');
                    d.ondragend = () => d.classList.remove('dragging');
                    b.appendChild(d);
                });

                b.ondragover = e => { e.preventDefault(); b.classList.add('drag-over'); };
                b.ondragleave = () => b.classList.remove('drag-over');
                b.ondrop = e => {
                    e.preventDefault(); b.classList.remove('drag-over');
                    const dragging = document.querySelector('.dragging');
                    if (!dragging) return;
                    const id = dragging.dataset.id;
                    const idx = cards.findIndex(x => x.id === id);
                    if (idx > -1) {
                        cards[idx].status = st;
                        localStorage.setItem('lotus_crm_cards', JSON.stringify(cards));
                        renderBoard();
                    }
                };
            });
        }

        document.getElementById('btn-upload').onclick = () => {
            document.getElementById('upload-modal').classList.add('active');
            document.getElementById('order-form').classList.add('hidden');
            document.getElementById('upload-area').classList.remove('hidden');
        };

        document.getElementById('file-input').onchange = async e => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('upload-area').classList.add('hidden');
            document.getElementById('scan-loader').classList.remove('hidden');
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                try {
                    const key = localStorage.getItem('lotus_gemini_key');
                    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key='+key, {
                        method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: "JSON: customerName, phone, address, amount" }, { inlineData: { mimeType: file.type, data: reader.result.split(',')[1] } }] }] })
                    });
                    const d = await res.json();
                    const json = JSON.parse(d.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim());
                    document.getElementById('scan-loader').classList.add('hidden');
                    document.getElementById('order-form').classList.remove('hidden');
                    document.getElementById('customerName').value = json.customerName || '';
                    document.getElementById('phone').value = json.phone || '';
                    document.getElementById('address').value = json.address || '';
                    document.getElementById('amount').value = String(json.amount).replace(/[^0-9]/g, '') || '';
                } catch (err) { alert("Lỗi!"); document.getElementById('scan-loader').classList.add('hidden'); document.getElementById('upload-area').classList.remove('hidden'); }
            };
        };

        document.getElementById('order-form').onsubmit = e => {
            e.preventDefault();
            const c = { id: Date.now().toString(), customerName: document.getElementById('customerName').value, amount: document.getElementById('amount').value, status: 'quote', date: new Date().toISOString() };
            cards.unshift(c);
            localStorage.setItem('lotus_crm_cards', JSON.stringify(cards));
            renderBoard();
            closeModals();
        };

        renderBoard();
    </script>
</body>
</html>
