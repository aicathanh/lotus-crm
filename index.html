<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotus CRM - v7.0 Diagnostic</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .modal-overlay { display: none !important; }
        .modal-overlay.active { display: flex !important; opacity: 1 !important; pointer-events: auto !important; }
        .app-header { z-index: 10000 !important; position: relative !important; }
        #debug-tag { background: #EAB308 !important; color: #000000 !important; }
        .test-res { margin-top: 10px; font-size: 12px; padding: 10px; border-radius: 4px; display: none; }
        .test-res.err { display: block; background: #FEE2E2; color: #DC2626; border: 1px solid #FECACA; }
        .test-res.ok { display: block; background: #DCFCE7; color: #16A34A; border: 1px solid #BBF7D0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="debug-tag" style="position:fixed; top:0; left:0; font-size:10px; padding:2px 8px; z-index:10001; border-radius: 0 0 4px 0; font-weight:bold;">v7.0 - Diagnostic</div>

    <div class="app-container">
        <header class="app-header">
            <div class="logo"><i class="fa-solid fa-leaf"></i> <span>Lotus CRM</span></div>
            <div class="header-filters">
                <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="search-input" oninput="renderBoard()" placeholder="Tìm kiếm..."></div>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline" onclick="openSettings()"><i class="fa-solid fa-gear"></i></button>
                <button class="btn btn-outline" onclick="openDashboard()"><i class="fa-solid fa-chart-pie"></i></button>
                <button class="btn btn-primary" onclick="openUpload()"><i class="fa-solid fa-cloud-arrow-up"></i> Tải Báo Giá</button>
            </div>
        </header>

        <main class="board" id="board">
            <div class="column" data-status="quote"><div class="column-header" style="border-top-color: var(--tag-quote)"><div class="column-header-top"><span>Báo Giá</span><span class="col-count">0</span></div><div class="col-total">0 đ</div></div><div class="column-body" id="col-quote"></div></div>
            <div class="column" data-status="confirm"><div class="column-header" style="border-top-color: var(--tag-confirm)"><div class="column-header-top"><span>Chốt Đơn</span><span class="col-count">0</span></div><div class="col-total">0 đ</div></div><div class="column-body" id="col-confirm"></div></div>
            <div class="column" data-status="deliver"><div class="column-header" style="border-top-color: var(--tag-deliver)"><div class="column-header-top"><span>Đã Giao</span><span class="col-count">0</span></div><div class="col-total">0 đ</div></div><div class="column-body" id="col-deliver"></div></div>
            <div class="column" data-status="paid"><div class="column-header" style="border-top-color: var(--tag-paid)"><div class="column-header-top"><span>Đã Thu Tiền</span><span class="col-count">0</span></div><div class="col-total">0 đ</div></div><div class="column-body" id="col-paid"></div></div>
            <div class="column" data-status="debt"><div class="column-header" style="border-top-color: var(--tag-debt)"><div class="column-header-top"><span>Công Nợ</span><span class="col-count">0</span></div><div class="col-total">0 đ</div></div><div class="column-body" id="col-debt"></div></div>
            <div class="column" data-status="completed"><div class="column-header" style="border-top-color: #0F766E"><div class="column-header-top"><span>Hoàn Tất</span><span class="col-count">0</span></div><div class="col-total">0 đ</div></div><div class="column-body" id="col-completed"></div></div>
        </main>
    </div>

    <!-- Settings Modal with Diagnostic -->
    <div class="modal-overlay" id="settings-modal"><div class="modal"><div class="modal-header"><h3>Cài đặt AI</h3><button class="close-btn" onclick="closeAll()"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body">
        <div class="form-group"><label>Google Gemini API Key</label><input type="password" id="apiKeyInput" placeholder="Dán mã vào đây..."></div>
        <div id="test-result" class="test-res"></div>
        <div class="form-actions" style="margin-top:15px;">
            <button class="btn btn-outline" onclick="testAIConnection()">Kiểm tra kết nối AI</button>
            <button class="btn btn-primary" onclick="saveKey()">Lưu & Đóng</button>
        </div>
    </div></div></div>

    <div class="modal-overlay" id="upload-modal"><div class="modal"><div class="modal-header"><h3>Tải Báo Giá</h3><button class="close-btn" onclick="closeAll()"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body"><div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()"><input type="file" id="file-input" accept="image/*" hidden onchange="handleFile(this.files[0])"><i class="fa-regular fa-image upload-icon"></i><p>Nhấn hoặc Kéo thả ảnh báo giá</p></div><div id="scan-loader" class="scan-loader hidden"><div class="spinner"></div><p id="loader-text">AI đang phân tích...</p></div><form id="order-form" class="hidden" onsubmit="saveOrder(event)"><div class="form-grid"><div class="form-group"><label>Tên Khách</label><input type="text" id="customerName" required></div><div class="form-group"><label>SĐT</label><input type="text" id="phone"></div><div class="form-group full-width"><label>Địa Chỉ</label><input type="text" id="address"></div><div class="form-group"><label>Số Báo Giá</label><input type="text" id="quoteNumber"></div><div class="form-group"><label>Tổng Tiền</label><input type="text" id="amount" required></div></div><div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeAll()">Hủy</button><button type="submit" class="btn btn-primary">Lưu Đơn</button></div></form></div></div></div>
    <div class="modal-overlay" id="dashboard-modal"><div class="modal modal-lg"><div class="modal-header"><h3>Thống Kê</h3><button class="close-btn" onclick="closeAll()"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body"><div class="dashboard-grid"><div class="stat-card"><div class="stat-info"><span class="stat-label">Báo Giá</span><h4 class="stat-value" id="stat-quote">0 đ</h4></div></div><div class="stat-card"><div class="stat-info"><span class="stat-label">Hoàn Tất</span><h4 class="stat-value" id="stat-completed">0 đ</h4></div></div><div class="stat-card"><div class="stat-info"><span class="stat-label">Công Nợ</span><h4 class="stat-value" id="stat-debt">0 đ</h4></div></div></div></div></div></div>

    <script>
        var SUPABASE_URL = 'https://zbnnctvggpupdnjmydcu.supabase.co';
        var SUPABASE_KEY = 'sb_publishable__Uc7k0lfdHFzBjWT-3o36w_ydCDXOT8';
        var supabase = null;
        var cards = JSON.parse(localStorage.getItem('lotus_crm_cards') || '[]');

        function closeAll() { var ms = document.querySelectorAll('.modal-overlay'); for(var i=0; i<ms.length; i++) ms[i].classList.remove('active'); }
        function openSettings() { document.getElementById('apiKeyInput').value = localStorage.getItem('lotus_gemini_key') || ''; document.getElementById('settings-modal').classList.add('active'); document.getElementById('test-result').className = 'test-res'; }
        function openDashboard() { updateStats(); document.getElementById('dashboard-modal').classList.add('active'); }
        function openUpload() { document.getElementById('upload-modal').classList.add('active'); document.getElementById('order-form').classList.add('hidden'); document.getElementById('upload-area').classList.remove('hidden'); }
        function saveKey() { localStorage.setItem('lotus_gemini_key', document.getElementById('apiKeyInput').value.trim()); alert('Đã lưu!'); closeAll(); }
        function saveLocal() { localStorage.setItem('lotus_crm_cards', JSON.stringify(cards)); }

        function renderBoard() {
            var search = (document.getElementById('search-input').value || '').toLowerCase();
            var states = ['quote', 'confirm', 'deliver', 'paid', 'debt', 'completed'];
            states.forEach(function(st) {
                var b = document.getElementById('col-' + st); if (!b) return; b.innerHTML = '';
                var list = cards.filter(function(c) { return c.status === st; });
                if (search) list = list.filter(function(c) { return (c.customerName || '').toLowerCase().indexOf(search) > -1 || (c.phone || '').indexOf(search) > -1; });
                var h = b.parentElement; var sum = 0; list.forEach(function(item) { sum += (Number(item.amount) || 0); });
                h.querySelector('.col-count').textContent = list.length; h.querySelector('.col-total').textContent = new Intl.NumberFormat('vi-VN').format(sum) + ' đ';
                list.forEach(function(c) {
                    var d = document.createElement('div'); d.className = 'card'; d.draggable = true; d.setAttribute('data-id', c.id);
                    d.innerHTML = '<div class="card-header"><span class="card-quote">#' + (c.quoteNumber || '---') + '</span><span>' + new Date(c.date).toLocaleDateString('vi-VN') + '</span></div>' +
                                  '<div class="card-customer">' + c.customerName + '</div><div class="card-footer"><div>' + Number(c.amount).toLocaleString() + ' đ</div>' +
                                  '<button class="btn-delete" onclick="deleteCard(\'' + c.id + '\')"><i class="fa-solid fa-trash"></i></button></div>';
                    d.ondragstart = function() { d.classList.add('dragging'); }; d.ondragend = function() { d.classList.remove('dragging'); }; b.appendChild(d);
                });
                b.ondragover = function(e) { e.preventDefault(); };
                b.ondrop = function(e) { e.preventDefault(); var drag = document.querySelector('.dragging'); if (drag) { var id = drag.getAttribute('data-id'); var idx = -1; for(var i=0; i<cards.length; i++) { if(cards[i].id === id) { idx = i; break; } } if (idx > -1) { cards[idx].status = st; saveLocal(); renderBoard(); if (supabase) supabase.from('orders').update({status: st}).eq('id', id).then(function(){}); } } };
            });
            updateStats();
        }

        function testAIConnection() {
            var key = document.getElementById('apiKeyInput').value.trim();
            var resEl = document.getElementById('test-result');
            if (!key) { alert("Vui lòng nhập API Key!"); return; }
            resEl.textContent = "Đang kiểm tra..."; resEl.className = "test-res ok";
            fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + key, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: "Hãy trả lời đúng một từ: OK" }] }] })
            }).then(function(res) {
                return res.json().then(function(d) {
                    if (res.ok) { resEl.textContent = "Kết nối thành công! AI sẵn sàng."; resEl.className = "test-res ok"; }
                    else { resEl.textContent = "Lỗi kết nối: " + (d.error ? d.error.message : "Không xác định"); resEl.className = "test-res err"; }
                });
            }).catch(function(e) { resEl.textContent = "Lỗi mạng hoặc API: " + e.message; resEl.className = "test-res err"; });
        }

        function handleFile(file) {
            if (!file) return;
            document.getElementById('upload-area').classList.add('hidden');
            document.getElementById('scan-loader').classList.remove('hidden');
            var reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = function() {
                var key = (localStorage.getItem('lotus_gemini_key') || '').trim();
                var base64 = reader.result.split(',')[1];
                var body = { contents: [{ parts: [{ text: "Hãy đọc ảnh báo giá này và trả về JSON chuẩn gồm các trường: customerName, phone, address, quoteNumber, amount (chỉ lấy số). Nếu không thấy trường nào hãy để trống." }, { inlineData: { mimeType: file.type, data: base64 } }] }] };
                
                // MULTI-MODEL FALLBACK
                var models = ['gemini-1.5-flash', 'gemini-1.5-flash-8b', 'gemini-pro-vision'];
                var tryIdx = 0;

                function tryNext() {
                    if (tryIdx >= models.length) {
                        alert("Cả 3 mô hình đều báo lỗi! Có thể API Key của bạn bị giới hạn vùng miền.");
                        document.getElementById('scan-loader').classList.add('hidden'); document.getElementById('upload-area').classList.remove('hidden');
                        return;
                    }
                    var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + models[tryIdx] + ':generateContent?key=' + key;
                    fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
                    .then(function(res) {
                        if (!res.ok) return res.json().then(function(e) { throw new Error(e.error ? e.error.message : "Lỗi"); });
                        return res.json();
                    }).then(function(d) {
                        var text = d.candidates[0].content.parts[0].text;
                        var json = JSON.parse(text.replace(/```json/g, '').replace(/```/g, '').trim());
                        document.getElementById('scan-loader').classList.add('hidden');
                        document.getElementById('order-form').classList.remove('hidden');
                        document.getElementById('customerName').value = json.customerName || '';
                        document.getElementById('phone').value = json.phone || '';
                        document.getElementById('address').value = json.address || '';
                        document.getElementById('quoteNumber').value = json.quoteNumber || '';
                        document.getElementById('amount').value = String(json.amount || '').replace(/[^0-9]/g, '') || '';
                    }).catch(function(err) {
                        console.log("Thử " + models[tryIdx] + " lỗi, chuyển sang cái tiếp theo...");
                        tryIdx++; tryNext();
                    });
                }
                tryNext();
            };
        }

        var ua = document.getElementById('upload-area');
        if (ua) {
            ua.ondragover = function(e) { e.preventDefault(); ua.classList.add('drag-over'); };
            ua.ondragleave = function() { ua.classList.remove('drag-over'); };
            ua.ondrop = function(e) { e.preventDefault(); ua.classList.remove('drag-over'); if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
        }

        function saveOrder(e) {
            e.preventDefault();
            var c = { id: Date.now().toString(), customerName: document.getElementById('customerName').value, phone: document.getElementById('phone').value, address: document.getElementById('address').value, quoteNumber: document.getElementById('quoteNumber').value, amount: parseInt(document.getElementById('amount').value) || 0, status: 'quote', date: new Date().toISOString() };
            cards.unshift(c); saveLocal(); renderBoard(); closeAll();
            if (supabase) supabase.from('orders').upsert({ id: c.id, customerName: c.customerName, phone: c.phone, address: c.address, quoteNumber: c.quoteNumber, amount: String(c.amount), status: c.status }).then(function(){});
        }

        function deleteCard(id) { if (confirm('Xoá?')) { cards = cards.filter(function(x) { return x.id !== id; }); saveLocal(); renderBoard(); if (supabase) supabase.from('orders').delete().eq('id', id).then(function(){}); } }

        function updateStats() {
            var sumBy = function(s) { var total = 0; cards.forEach(function(c) { if(c.status === s) total += (Number(c.amount) || 0); }); return total; };
            var fmt = function(v) { return new Intl.NumberFormat('vi-VN').format(v) + ' đ'; };
            if (document.getElementById('stat-quote')) document.getElementById('stat-quote').textContent = fmt(sumBy('quote'));
            if (document.getElementById('stat-completed')) { var cTotal = 0; cards.forEach(function(c) { if(['completed','paid','deliver'].indexOf(c.status) > -1) cTotal += (Number(c.amount) || 0); }); document.getElementById('stat-completed').textContent = fmt(cTotal); }
            if (document.getElementById('stat-debt')) document.getElementById('stat-debt').textContent = fmt(sumBy('debt'));
        }

        renderBoard();
        setTimeout(function() {
            if (window.supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                supabase.from('orders').select('*').order('created_at', { ascending: false }).then(function(res) {
                    if (res.data && res.data.length > 0) { cards = res.data.map(function(d) { return { id: d.id, customerName: d.customerName, phone: d.phone, address: d.address, quoteNumber: d.quoteNumber, amount: parseInt(d.amount) || 0, status: d.status, date: d.created_at }; }); renderBoard(); saveLocal(); }
                });
            }
        }, 500);
    </script>
</body>
</html>
